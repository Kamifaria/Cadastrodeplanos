version: '3.9'
services:
  web:
    image: node:20-alpine
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app
    ports:
      - "4200:4200"
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 4200"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api

  api:
    image: node:20-alpine
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app
    ports:
      - "3000:3000"
    command: sh -c "npx json-server --watch mock-api/db.json --port 3000 --host 0.0.0.0"