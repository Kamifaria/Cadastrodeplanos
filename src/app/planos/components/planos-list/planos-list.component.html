<section style="padding:24px">
  <mat-card>
    <div style="display:flex;align-items:center;gap:12px;justify-content:space-between">
      <h2 style="margin:0">Planos</h2>
      <a mat-raised-button color="primary" routerLink="/planos/novo">Novo Plano</a>
    </div>
    <div style="display:flex;align-items:center;gap:16px;margin:12px 0;justify-content:space-between">
      <nav aria-label="breadcrumb" style="font-size:12px;color:#666">
        <a routerLink="/">Início</a>
        <mat-icon style="vertical-align:middle">chevron_right</mat-icon>
        <span>Planos</span>
      </nav>
      <mat-form-field appearance="fill" style="width:320px">
        <mat-label>Filtrar</mat-label>
        <input matInput #filter (keyup)="applyFilter(filter.value)" placeholder="Digite para filtrar" />
      </mat-form-field>
    </div>

    <table mat-table [dataSource]="data" matSort style="width:100%">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
        <td mat-cell *matCellDef="let p">{{ p.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="codigo_registro_ans">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Código ANS</th>
        <td mat-cell *matCellDef="let p">{{ p.codigo_registro_ans }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Ações">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item [routerLink]="['/planos/editar', p.id]">
              <mat-icon>edit</mat-icon>
              <span>Editar</span>
            </button>
            <button mat-menu-item (click)="remover(p.id)">
              <mat-icon>delete</mat-icon>
              <span>Excluir</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,25]" showFirstLastButtons></mat-paginator>
  </mat-card>
</section>
<a mat-fab color="primary" routerLink="/planos/novo" style="position:fixed;right:24px;bottom:24px;z-index:1000">
  <mat-icon>add</mat-icon>
</a>
