<section>
  <mat-card>
    <h2>Plano</h2>
    <form [formGroup]="form">
      <mat-form-field appearance="fill" style="width:100%">
        <mat-label>Nome</mat-label>
        <input matInput type="text" formControlName="nome" />
        <mat-error *ngIf="invalid('nome')">Informe o nome (mínimo 3 caracteres).</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" style="width:100%">
        <mat-label>Código ANS</mat-label>
        <input matInput type="text" formControlName="codigo_registro_ans" />
        <mat-error *ngIf="invalid('codigo_registro_ans')">Formato esperado: ANS-000000.</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="button" (click)="salvar()" [disabled]="!form.valid">Salvar</button>
    </form>
  </mat-card>
</section>
