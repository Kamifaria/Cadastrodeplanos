<section style="padding:24px">
  <mat-card>
    <div style="display:flex;align-items:center;gap:12px;justify-content:space-between">
      <h2 style="margin:0">Beneficiários</h2>
      <a mat-raised-button color="primary" routerLink="/beneficiarios/novo">Novo Beneficiário</a>
    </div>

    <div style="margin:12px 0">
      <mat-form-field appearance="fill" style="width:320px">
        <mat-label>Filtrar</mat-label>
        <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Digite para filtrar" />
      </mat-form-field>
    </div>

    <table mat-table [dataSource]="data" matSort style="width:100%">
      <ng-container matColumnDef="nome_completo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
        <td mat-cell *matCellDef="let b">{{ b.nome_completo }}</td>
      </ng-container>

      <ng-container matColumnDef="cpf">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>CPF</th>
        <td mat-cell *matCellDef="let b">{{ b.cpf }}</td>
      </ng-container>

      <ng-container matColumnDef="plano">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Plano</th>
        <td mat-cell *matCellDef="let b">{{ b.plano?.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let b">{{ b.status }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let b">
          <a mat-stroked-button color="primary" [routerLink]="['/beneficiarios/editar', b.id]">Editar</a>
          <button mat-icon-button color="warn" type="button" (click)="remover(b.id)" aria-label="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,25]" showFirstLastButtons></mat-paginator>
  </mat-card>
</section>
