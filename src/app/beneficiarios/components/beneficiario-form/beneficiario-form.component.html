<section>
  <mat-card>
    <h2>Beneficiário</h2>
    <form [formGroup]="form">
      <mat-form-field appearance="fill" style="width:100%">
        <mat-label>Nome Completo</mat-label>
        <input matInput type="text" formControlName="nome_completo" />
        <mat-error *ngIf="invalid('nome_completo')">Informe o nome (mínimo 3 caracteres).</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" style="width:100%">
        <mat-label>CPF</mat-label>
        <input matInput type="text" formControlName="cpf" />
        <mat-error *ngIf="invalid('cpf')">CPF inválido.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" style="width:100%">
        <mat-label>Data de Nascimento</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="data_nascimento" />
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="invalid('data_nascimento')">Informe a data de nascimento.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" style="width:100%">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option value="ATIVO">ATIVO</mat-option>
          <mat-option value="INATIVO">INATIVO</mat-option>
        </mat-select>
        <mat-error *ngIf="invalid('status')">Informe o status.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" style="width:100%">
        <mat-label>Plano</mat-label>
        <mat-select formControlName="plano_id">
          <mat-option [value]="null" disabled>Selecione</mat-option>
          <mat-option *ngFor="let p of planos" [value]="p.id">{{ p.nome }}</mat-option>
        </mat-select>
        <mat-error *ngIf="invalid('plano_id')">Selecione um plano.</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="button" (click)="salvar()" [disabled]="!form.valid">Salvar</button>
    </form>
  </mat-card>
</section>
